packages:
  - apps/*
  - packages/*
allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  prisma: true
  protobufjs: false
# Security overrides (pnpm audit): GHSA for deepmerge-ts <8 (via prisma) and js-yaml <=5.4.0 (via @nestjs/swagger).
overrides:
  deepmerge-ts: ^8.0.0
  js-yaml: ^5.4.1
minimumReleaseAgeExclude:
  - lucide-react@1.60.0
  - steiger@0.8.0
